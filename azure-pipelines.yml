trigger:
- main

pool:
  name: Default

variables:
  - name: projectName
    value: azuredemo
  - name: pythonVersion
    value: '3.10'
  - name: artifactName
    value: drop
  - name: deployPath
    value: 'C:\azuredemo-deploy'

stages:
- stage: Build
  displayName: Build and Test
  jobs:
  - job: BuildJob
    displayName: Build and Run Tests
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
      displayName: 'Use Python $(pythonVersion)'

    - script: |
        uv sync
      displayName: 'Install dependencies with uv'

    - script: |
        uv run pytest tests/ --cov=azuredemo --cov-report=term-missing --cov-report=html --cov-report=xml
      displayName: 'Run unit tests with coverage'

    - task: PublishCodeCoverageResults@1
      inputs:
        codeCoverageTool: 'cobertura'
        summaryFileLocation: 'coverage.xml'
        reportDirectory: 'htmlcov'
      displayName: 'Publish code coverage'

    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: '$(Build.SourcesDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(projectName).zip'
        replaceExistingArchive: true
      displayName: 'Archive project files'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: '$(artifactName)'
        publishLocation: 'Container'
      displayName: 'Publish build artifacts'

- stage: Deploy
  displayName: Deploy to Local Agent
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployJob
    displayName: Deploy to Local Windows Agent
    steps:
    - task: DownloadBuildArtifacts@0
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: '$(artifactName)'
        downloadPath: '$(System.ArtifactsDirectory)'
      displayName: 'Download build artifacts'

    - task: ExtractFiles@1
      inputs:
        archiveFilePatterns: '$(System.ArtifactsDirectory)/$(artifactName)/$(projectName).zip'
        destinationFolder: '$(deployPath)'
        cleanDestinationFolder: true
      displayName: 'Extract deployment package'

    - powershell: |
        if (-not (Get-Command uv -ErrorAction SilentlyContinue)) {
          Invoke-WebRequest -Uri "https://astral.sh/uv/install.sh" -OutFile "install-uv.sh"
          bash install-uv.sh
          Remove-Item install-uv.sh
        }
        $env:PATH += ";$env:USERPROFILE\.cargo\bin"
        Write-Host "##vso[task.setvariable variable=PATH]$env:PATH"
      displayName: 'Install uv on target if not exists'

    - script: |
        cd $(deployPath)
        uv sync
        uv pip install . --force-reinstall
      displayName: 'Install application'

    - script: |
        uv run azuredemo --help
      displayName: 'Verify installation'

    - task: CmdLine@2
      inputs:
        script: |
          echo "Deployment completed successfully at %date% %time%"
          dir $(deployPath)
      displayName: 'Deployment verification'
