trigger:
- main

pool:
  name: Default

variables:
  - name: projectName
    value: azuredemo
  - name: pythonVersion
    value: '3.10'
  - name: uvVersion
    value: '0.1.30'
  - name: artifactName
    value: drop

stages:
- stage: Build
  displayName: Build and Test
  jobs:
  - job: BuildJob
    displayName: Build and Run Tests
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
      displayName: 'Use Python $(pythonVersion)'

    - script: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "##vso[task.setvariable variable=PATH]$PATH:$HOME/.cargo/bin"
      displayName: 'Install uv'

    - script: |
        uv sync --all-extras
      displayName: 'Install dependencies with uv'

    - script: |
        uv run pytest tests/ --cov=azuredemo --cov-report=term-missing --cov-report=html --cov-report=xml
      displayName: 'Run unit tests with coverage'

    - task: PublishCodeCoverageResults@1
      inputs:
        codeCoverageTool: 'cobertura'
        summaryFileLocation: 'coverage.xml'
        reportDirectory: 'htmlcov'
      displayName: 'Publish code coverage'

    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: '$(Build.SourcesDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(projectName).zip'
        replaceExistingArchive: true
      displayName: 'Archive project files'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: '$(artifactName)'
        publishLocation: 'Container'
      displayName: 'Publish build artifacts'

- stage: Deploy
  displayName: Deploy to Production
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployJob
    displayName: Deploy to VM
    environment:
      name: Production
      resourceType: VirtualMachine
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadBuildArtifacts@0
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: '$(artifactName)'
              downloadPath: '$(System.ArtifactsDirectory)'
            displayName: 'Download build artifacts'

          - task: ExtractFiles@1
            inputs:
              archiveFilePatterns: '$(System.ArtifactsDirectory)/$(artifactName)/$(projectName).zip'
              destinationFolder: '$(System.DefaultWorkingDirectory)/deploy'
              cleanDestinationFolder: true
            displayName: 'Extract deployment package'

          - script: |
              curl -LsSf https://astral.sh/uv/install.sh | sh
              echo "##vso[task.setvariable variable=PATH]$PATH:$HOME/.cargo/bin"
            displayName: 'Install uv on target'

          - script: |
              cd $(System.DefaultWorkingDirectory)/deploy
              uv sync
              uv run pip install .
            displayName: 'Install application'

          - script: |
              uv run azuredemo --help
            displayName: 'Verify installation'

          - task: CmdLine@2
            inputs:
              script: |
                echo "Deployment completed successfully at $(date)"
            displayName: 'Deployment verification'